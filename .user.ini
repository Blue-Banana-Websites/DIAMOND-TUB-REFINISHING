; Raises PHP's default upload limits so 3 full-size phone photos (HEIC
; especially) can reach quote-handler.php. Most cPanel hosts run PHP-FPM
; and honor .user.ini per-directory without needing shell/root access.
; If uploads still fail, raise these from the hosting control panel's
; PHP settings (e.g. MultiPHP INI Editor) instead.
upload_max_filesize = 20M
post_max_size = 65M
max_file_uploads = 5
max_execution_time = 60
